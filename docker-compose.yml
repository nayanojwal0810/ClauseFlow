services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CF_DB_NAME}
      POSTGRES_USER: ${CF_DB_USER}
      POSTGRES_PASSWORD: ${CF_DB_PASSWORD:?CF_DB_PASSWORD is required in .env}
    ports:
      - "127.0.0.1:${CF_DB_PORT:-5433}:5432"
    volumes:
      - clauseflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  clauseflow_pgdata:

